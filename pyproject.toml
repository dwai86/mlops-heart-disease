[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-mlops"
version = "0.1.0"
description = "Heart disease prediction pipeline with FastAPI serving"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=2.2.0",
  "scikit-learn>=1.7.0",
  "matplotlib>=3.10.0",
  "seaborn>=0.13.2",
  "joblib>=1.4.2",
  "mlflow>=3.16.1",
  "fastapi>=0.116.1",
  "uvicorn>=0.35.0",
  "prometheus-client>=0.22.1",
  "pytest>=8.4.2",
  "httpx>=0.28.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend-exclude = ["notebooks"]
