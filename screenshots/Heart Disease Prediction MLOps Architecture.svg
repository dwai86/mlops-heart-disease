<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" role="img" aria-label="MLOps architecture from Cleveland dataset and preprocessing through model training, MLflow, FastAPI, Docker, Kubernetes, Prometheus and CI/CD">
 <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#5b7c98"/></marker></defs>
 <rect x="22" y="22" width="230" height="178" rx="14" fill="#e8f3fd" stroke="#8cb4d8"/><text x="137" y="49" text-anchor="middle" font-size="15" font-weight="700" fill="#18466d">1 · DATA &amp; EDA</text><rect x="43" y="66" width="188" height="44" rx="8" fill="#fff" stroke="#b5cfe5"/><text x="137" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#264763">UCI Cleveland</text><text x="137" y="99" text-anchor="middle" font-size="10" fill="#526c81">303 rows · 13 predictors</text><rect x="43" y="124" width="188" height="55" rx="8" fill="#fff" stroke="#b5cfe5"/><text x="137" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#264763">EDA &amp; Data checks</text><text x="137" y="160" text-anchor="middle" font-size="10" fill="#526c81">missing values · class balance</text><text x="137" y="172" text-anchor="middle" font-size="10" fill="#526c81">histograms · correlation</text>
 <rect x="288" y="22" width="300" height="178" rx="14" fill="#e9f8f4" stroke="#8dcfc2"/><text x="438" y="49" text-anchor="middle" font-size="15" font-weight="700" fill="#176258">2 · MODEL DEVELOPMENT</text><rect x="309" y="66" width="258" height="44" rx="8" fill="#fff" stroke="#a8d8cf"/><text x="438" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#215c55">ColumnTransformer + Pipeline</text><text x="438" y="99" text-anchor="middle" font-size="10" fill="#527d76">numeric scaling · categorical encoding</text><rect x="309" y="124" width="122" height="55" rx="8" fill="#fff" stroke="#a8d8cf"/><text x="370" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#215c55">Logistic Regression</text><text x="370" y="161" text-anchor="middle" font-size="10" fill="#527d76">GridSearchCV · 5-fold CV</text><rect x="445" y="124" width="122" height="55" rx="8" fill="#fff" stroke="#a8d8cf"/><text x="506" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#215c55">Random Forest</text><text x="506" y="161" text-anchor="middle" font-size="10" fill="#527d76">GridSearchCV · 5-fold CV</text>
 <rect x="624" y="22" width="190" height="178" rx="14" fill="#fff5df" stroke="#e4c37b"/><text x="719" y="49" text-anchor="middle" font-size="15" font-weight="700" fill="#80551c">3 · TRACKING</text><rect x="646" y="73" width="146" height="89" rx="9" fill="#fff" stroke="#e4c37b"/><text x="719" y="96" text-anchor="middle" font-size="14" font-weight="800" fill="#80551c">MLflow</text><text x="719" y="116" text-anchor="middle" font-size="10" fill="#876a3e">params · CV/test metrics</text><text x="719" y="132" text-anchor="middle" font-size="10" fill="#876a3e">plots · model artifacts</text><text x="719" y="147" text-anchor="middle" font-size="10" fill="#876a3e">best CV ROC-AUC</text>
