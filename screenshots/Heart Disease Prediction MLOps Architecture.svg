 <rect x="22" y="244" width="320" height="148" rx="14" fill="#eaf5ff" stroke="#9ec2e1"/><text x="182" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#18466d">5 · AUTOMATED CI</text><rect x="44" y="290" width="276" height="78" rx="9" fill="#fff" stroke="#b5cfe5"/><text x="182" y="311" text-anchor="middle" font-size="12" font-weight="700" fill="#264763">GitHub Actions</text><text x="182" y="331" text-anchor="middle" font-size="11" fill="#526c81">Ruff → pytest → train</text><text x="182" y="349" text-anchor="middle" font-size="10" fill="#526c81">Python 3.11 · fail on errors</text>
 <rect x="380" y="244" width="300" height="148" rx="14" fill="#eef7ed" stroke="#b3d1ad"/><text x="530" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#356b32">6 · CONTAINER &amp; ORCHESTRATION</text><rect x="400" y="290" width="120" height="78" rx="9" fill="#fff" stroke="#c3dcbf"/><text x="460" y="314" text-anchor="middle" font-size="12" font-weight="700" fill="#356b32">Docker</text><text x="460" y="334" text-anchor="middle" font-size="10" fill="#537b50">API image</text><text x="460" y="348" text-anchor="middle" font-size="10" fill="#537b50">container runtime</text><rect x="536" y="290" width="124" height="78" rx="9" fill="#fff" stroke="#c3dcbf"/><text x="598" y="314" text-anchor="middle" font-size="12" font-weight="700" fill="#356b32">Kubernetes</text><text x="598" y="334" text-anchor="middle" font-size="10" fill="#537b50">Deployment · Service</text><text x="598" y="348" text-anchor="middle" font-size="10" fill="#537b50">local Kind validation</text>
 <rect x="718" y="244" width="340" height="148" rx="14" fill="#fff0ed" stroke="#e8b2a6"/><text x="888" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#8a3e2d">7 · OBSERVABILITY</text><rect x="740" y="290" width="296" height="78" rx="9" fill="#fff" stroke="#edc0b6"/><text x="888" y="314" text-anchor="middle" font-size="12" font-weight="700" fill="#8a3e2d">Prometheus-compatible metrics</text><text x="888" y="334" text-anchor="middle" font-size="10" fill="#97685e">request counts · latency</text><text x="888" y="349" text-anchor="middle" font-size="10" fill="#97685e">request logs · troubleshooting</text>
 <path d="M954 200 V223 H598 V238" fill="none" stroke="#5b7c98" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/><path d="M342 319 H374" stroke="#5b7c98" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/><path d="M680 319 H712" stroke="#5b7c98" stroke-width="2" marker-end="url(#arr)"/><rect x="22" y="432" width="1036" height="124" rx="14" fill="#f7f9fc" stroke="#d5e0eb"/><text x="40" y="459" font-size="14" font-weight="700" fill="#203e5e">Operational feedback loop</text><text x="40" y="485" font-size="12" fill="#52677e">Code change / pull request → automated lint &amp; tests → train and log candidate models → package selected pipeline → serve predictions</text><text x="40" y="507" font-size="12" fill="#52677e">Runtime request/latency telemetry and logs support troubleshooting; experiment artifacts provide traceability for model selection.</text><text x="40" y="534" font-size="10" fill="#758396">Note: diagram shows the implemented workflow concept; it does not imply public-cloud deployment or persistent CI artifact archiving.</text>
 </svg>
